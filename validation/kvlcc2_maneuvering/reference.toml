[paper]
authors = "In-Tae Kim, Cheolho Kim, Sang-Hyun Kim, Donghyeong Ko, Seong-Ho Moon, Hwanghi Park, Jaewoong Kwon, and Bongyong Jin"
title = "Estimation of the manoeuvrability of the KVLCC2 in calm water using free running simulation based on CFD"
journal = "International Journal of Naval Architecture and Ocean Engineering"
volume = 13
year = 2021
pages = "466-477"
doi = "10.1016/j.ijnaoe.2021.05.004"
table_4_page = 469
table_7_page = 475
table_8_page = 476

[ship]
length_pp_m = 320.0
beam_m = 58.0
draft_m = 20.8
displacement_m3 = 312600.0
block_coefficient = 0.81
froude_number = 0.142
model_scale = 45.7
model_length_pp_m = 7.0

[coordinates]
x = "forward"
y = "starboard"
z = "down"
origin = "midship"

[mmg.linear_hull]
source = "Table 4; described by the paper as derived from model tests published by Yasukawa and Yoshimura (2015)"
force_scale = "0.5*rho*Lpp*T*U^2"
moment_scale = "0.5*rho*Lpp^2*T*U^2"
v_prime = "v/U"
r_prime = "r*Lpp/U"
Y_v = -0.315
Y_r = 0.083
N_v = -0.137
N_r = -0.049

